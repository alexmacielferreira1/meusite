# Configuração das ferramentas de teste e lint. O app roda de backend/ (requirements.txt).
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
# Sem piso por enquanto: o número medido está no README.
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: textos longos (mensagens ao usuário e SQL) que o formatador não quebra.
# B008: Depends(...) e Query(...) nos parâmetros são o padrão do FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
