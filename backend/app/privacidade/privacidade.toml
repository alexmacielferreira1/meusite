# Privacidade do Folios (_kit_privacidade 0.1.1). Gera GET /api/v1/privacidade/aviso e as
# páginas /privacidade e /termos. Só o que o código faz hoje (auditoria de 08/11/2026,
# relatorios/saas_012_foliocom.md); o que falta decidir fica "[A PREENCHER]" e aparece como
# "em definição". Texto-base: precisa de revisão jurídica.

versao = "1.0"
atualizado_em = "2026-11-10"

[app]
nome = "Folios"
url = "https://foliocom.shardweb.app"
papel = "controlador"
tela_meus_dados = false           # não há tela "Meus dados" ainda
registro_acesso = false           # o app não guarda registro de acesso (pendência L-06 da auditoria)
pedidos_online = false            # o app não envia e-mail: pedidos por e-mail ao encarregado

[controlador]                     # decisão do Alex (09/11): em definição por enquanto
nome = "[A PREENCHER]"
documento = "[A PREENCHER]"
endereco = "[A PREENCHER]"
email = "[A PREENCHER]"

[encarregado]
nome = "[A PREENCHER]"
email = "[A PREENCHER]"
canal = "E-mail"

[[finalidades]]
